<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<meta name="description" content="Hostel WiFi Manager — keep the monthly bill book for two routers: name, room, device, MAC address and who has paid." />
<title>Hostel WiFi Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Cg fill='none' stroke='white' stroke-width='7' stroke-linecap='round'%3E%3Cpath d='M28 58a30 30 0 0 1 44 0'/%3E%3Cpath d='M39 70a15 15 0 0 1 22 0'/%3E%3C/g%3E%3Ccircle cx='50' cy='80' r='5' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===================== SIGN IN ===================== -->
<div id="loginScreen" class="login-simple">
  <div class="ls-card">
    <div class="ls-brand">
      <span class="brand-ico">📶</span>
      <div class="col">
        <b>Hostel WiFi Manager</b>
        <span class="small muted">Monthly bill book · 2 routers</span>
      </div>
    </div>

    <h1>Sign in</h1>
    <p class="lead">Use the email and password you created in Firebase Authentication.</p>

    <div class="err-box" id="loginErr" hidden></div>

    <label class="field">
      <span>Email</span>
      <input type="email" id="email" autocomplete="username" placeholder="you@example.com" />
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
    </label>

    <button class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign in</button>
    <button class="btn btn-ghost btn-block btn-sm" id="loginForgot">Forgot password?</button>

    <p class="login-note">Only your own email can open this book.<br />Data stays in your Firebase project.</p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="appShell" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-ico">📶</span>
      <span class="brand-t" id="brandName">Hostel WiFi</span>
    </div>

    <div class="spacer"></div>

    <div class="month-nav">
      <button id="prevMonth" title="Previous month" aria-label="Previous month">‹</button>
      <span id="monthLabel">—</span>
      <button id="nextMonth" title="Next month" aria-label="Next month">›</button>
    </div>

    <button class="btn btn-sm" id="monthToday" hidden title="Back to the current month">Today</button>

    <button class="icon-btn" id="themeToggle" title="Light / dark mode">🌙</button>

    <div class="user-wrap">
      <button class="icon-btn" id="userBtn" title="Account"><span class="user-ava" id="userInitial">U</span></button>
      <div class="user-menu" id="userMenu" hidden>
        <div class="um-head col">
          <b>Signed in</b>
          <span class="small muted" id="userMail">—</span>
        </div>
        <button id="udSettings">⚙️ Settings</button>
        <button id="udTheme">🌙 Switch theme</button>
        <button id="udLogout" class="danger">🚪 Sign out</button>
      </div>
    </div>
  </header>

  <main class="view" id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-wrap"></div>
<div id="loadingRoot" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
