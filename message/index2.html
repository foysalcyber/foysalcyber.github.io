<style>
  :root{--font-serif:'Cormorant Garamond',serif;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;--ease:cubic-bezier(.16,1,.3,1);--bg:#0A0A0C;--surface:#16161A;--surface-soft:#222228;--surface-hover:#2A2A32;--border:rgba(255,255,255,0.09);--border-strong:rgba(255,255,255,0.15);--text:#F2F0E8;--text-2:#B8B5C0;--text-3:#8A8894;--success:#22E3A0;--danger:#FF6B7A;--warn:#FFC46B;--shadow:0 16px 48px -16px rgba(0,0,0,0.6);--shadow-lg:0 28px 80px -20px rgba(0,0,0,0.7);}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 600px at 50% -10%, rgba(255,255,255,0.04) 0%, transparent 60%),linear-gradient(180deg,#0A0A0C 0%,#0F0F12 100%);}
  ::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:10px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  :focus-visible{outline:2px solid #F2F0E8;outline-offset:2px;border-radius:6px;}
  .app{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;}

  /* ---------- login ---------- */
  #login-screen{width:100%;display:flex;align-items:center;justify-content:center;}
  .login-card{width:100%;max-width:980px;display:grid;grid-template-columns:1.08fr 0.92fr;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:cardIn .7s var(--ease);}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .login-left{position:relative;padding:42px 44px;background:#0A0A0C;border-right:1px solid rgba(255,255,255,0.06);color:#F2F0E8;display:flex;flex-direction:column;justify-content:space-between;min-height:560px;overflow:hidden;}
  .login-left::before{content:"";position:absolute;inset:0;opacity:0.04;background-image:linear-gradient(rgba(255,255,255,0.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.6) 1px,transparent 1px);background-size:32px 32px;}
  .brand-top{display:flex;align-items:center;gap:10px;position:relative;}
  .mark{width:38px;height:38px;border-radius:50%;background:#F2F0E8;color:#0A0A0C;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:11px;}
  .brand-name{font-family:var(--font-display);font-weight:700;letter-spacing:3px;font-size:13px;}
  .brand-tag{margin-left:auto;font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;color:#F2F0E8;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);padding:5px 9px;border-radius:100px;}
  .hero{position:relative;}
  .hero h1{font-family:var(--font-serif);font-weight:400;font-size:52px;line-height:1.05;letter-spacing:-1px;}
  .hero h1 i{font-style:italic;opacity:.85;}
  .login-right{padding:38px 36px;display:flex;flex-direction:column;justify-content:center;background:var(--surface);}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-3);margin-bottom:14px;}
  .eyebrow::after{content:"";height:1px;flex:1;background:var(--border);}
  .form-title{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.4px;}
  .form-desc{color:var(--text-2);font-size:13.5px;margin:6px 0 22px;line-height:1.5;}
  .field-label{font-family:var(--font-mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);display:block;margin-bottom:9px;}
  .people-row{display:flex;gap:10px;margin-bottom:20px;}
  .person-btn{flex:1;padding:14px 10px;border-radius:16px;border:1px solid var(--border);background:#222228;color:var(--text-2);font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;transition:all .2s var(--ease);display:flex;flex-direction:column;align-items:center;gap:8px;}
  .person-btn .pa{width:36px;height:36px;border-radius:50%;background:#16161A;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--text);}
  .person-btn.active{background:#F2F0E8;color:#0A0A0C;border-color:#F2F0E8;}
  .person-btn.active .pa{background:#0A0A0C;color:#F2F0E8;}
  .input-wrap{position:relative;margin-bottom:18px;}
  #password-input{width:100%;padding:14px 44px 14px 16px;border-radius:14px;border:1px solid var(--border);background:#222228;color:var(--text);font-family:var(--font-mono);font-size:14px;letter-spacing:2px;outline:none;}
  #password-input:focus{border-color:rgba(255,255,255,0.22);background:#2A2A32;}
  .toggle-visibility{position:absolute;right:6px;top:23px;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;border:none;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .hint{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);margin-top:9px;}
  .enter-btn{width:100%;padding:14px;border:none;border-radius:14px;background:#F2F0E8;color:#0A0A0C;font-family:var(--font-display);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
  .enter-btn:disabled{opacity:.35;cursor:not-allowed;}
  .enter-btn svg{stroke:#0A0A0C;}
  .login-error{color:var(--danger);font-size:12.5px;margin-top:12px;font-family:var(--font-mono);min-height:16px;}

  /* ---------- chat shell ---------- */
  #chat-screen{width:100%;height:100%;display:none;}
  #chat-screen.show{display:flex;justify-content:center;align-items:stretch;}
  .chat-wrap{width:100%;max-width:740px;height:100%;display:flex;flex-direction:column;gap:8px;padding:10px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);flex-shrink:0;}
  .peer{display:flex;align-items:center;gap:10px;min-width:0;}
  .avatar{width:38px;height:38px;border-radius:50%;background:#F2F0E8;color:#0A0A0C;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;position:relative;flex-shrink:0;}
  .avatar .dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid var(--surface);}
  .peer-name{font-family:var(--font-display);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;}
  .peer-name .verified{width:14px;height:14px;border-radius:50%;background:#F2F0E8;color:#0A0A0C;display:flex;align-items:center;justify-content:center;font-size:8px;}
  .peer-status{font-family:var(--font-mono);font-size:10.5px;color:var(--text-2);display:flex;align-items:center;gap:5px;margin-top:1px;}
  .peer-status .sdot{width:5px;height:5px;border-radius:50%;background:var(--text-3);}
  .peer-status.online .sdot{background:var(--success);}
  .top-actions{display:flex;gap:7px;align-items:center;}
  .icon-btn{width:34px;height:34px;border-radius:11px;border:1px solid var(--border);background:var(--surface-soft);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .icon-btn:hover{color:var(--text);border-color:var(--border-strong);}
  .icon-btn.active{background:#F2F0E8;color:#0A0A0C;border-color:#F2F0E8;}
  .icon-btn svg{width:15px;height:15px;}
  .search-box{display:none;align-items:center;gap:8px;background:var(--surface-soft);border:1px solid var(--border);border-radius:12px;padding:7px 10px;min-width:160px;}
  .search-box.show{display:flex;}
  .search-box input{background:none;border:none;outline:none;font-size:13px;color:var(--text);width:100%;font-family:var(--font-body);}

  /* offline / connection banner */
  .conn-banner{display:none;align-items:center;gap:8px;background:rgba(255,196,107,0.10);border:1px solid rgba(255,196,107,0.30);color:var(--warn);border-radius:12px;padding:8px 11px;font-family:var(--font-mono);font-size:11px;flex-shrink:0;}
  .conn-banner.show{display:flex;}
  .conn-banner .cdot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex-shrink:0;animation:pulseDot 1.4s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}

  /* pinned bar */
  .pinned-bar{display:none;align-items:center;gap:8px;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:12px;padding:8px 10px;flex-shrink:0;}
  .pinned-bar.show{display:flex;}
  .pinned-bar .pin-body{flex:1;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;text-align:left;padding:0;}
  .pinned-bar .pin-icon{width:24px;height:24px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .pinned-text{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .pinned-text b{font-weight:600;}
  .pinned-close{width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,0.08);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* ---------- messages area (wallpaper stays fixed, list scrolls) ---------- */
  .messages-area{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:#0E0E12;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;isolation:isolate;}
  .messages-area > .chat-bg,
  .messages-area > .chat-wallpaper,
  .messages-area > .wallpaper-vignette,
  .messages-area > .wallpaper-noise{position:absolute;inset:0;pointer-events:none;z-index:0;}
  .messages-area > .chat-bg{background:radial-gradient(600px 500px at 30% 20%, rgba(255,255,255,0.06) 0%, transparent 65%),linear-gradient(180deg,#0E0E12 0%,#0A0A0C 100%);}
  .messages-area > .chat-wallpaper{background-image:url("wallpaper-floral.jpg");background-size:cover;background-position:center top;background-repeat:no-repeat;opacity:0.28;filter:blur(0.4px) saturate(0.35) brightness(0.95);-webkit-mask-image:radial-gradient(ellipse at 50% 38%, black 58%, transparent 82%);mask-image:radial-gradient(ellipse at 50% 38%, black 58%, transparent 82%);}
  @media (min-width:761px){ .messages-area > .chat-wallpaper{background-size:auto 100%;background-position:center;background-color:#0E0E12;} }
  .messages-area > .wallpaper-vignette{background:linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 20%, transparent 78%, rgba(0,0,0,0.22) 100%);}
  .messages-area > .wallpaper-noise{opacity:0.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
  #messages{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:12px 4px;display:flex;flex-direction:column;min-height:0;}
  #msg-list{display:flex;flex-direction:column;gap:2px;}

  .load-older-wrap{display:none;justify-content:center;padding:2px 0 10px;}
  .load-older-wrap.show{display:flex;}
  .load-older{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text-2);font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:7px 14px;border-radius:100px;cursor:pointer;}
  .load-older:hover{background:rgba(255,255,255,0.12);color:var(--text);}
  .load-older:disabled{opacity:.5;cursor:default;}

  .date-sep{align-self:center;margin:10px 0 8px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.09);padding:4px 10px;border-radius:100px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.1px;color:var(--text-2);text-transform:uppercase;}
  .msg-row{display:flex;width:100%;margin:3px 0;animation:msgIn .30s var(--ease);position:relative;align-items:flex-start;gap:6px;contain:layout style;}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .msg-row.mine{justify-content:flex-end;}
  .msg-row.theirs{justify-content:flex-start;}
  .msg-row.flash .bubble{outline:2px solid #F2F0E8;outline-offset:2px;}
  .bubble{max-width:78%;padding:8px 11px 5px;border-radius:16px;font-size:13.4px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere;position:relative;box-shadow:0 3px 12px -6px rgba(0,0,0,0.35);}
  .msg-row.mine .bubble{background:#F2F0E8;color:#0A0A0C;border-bottom-right-radius:6px;}
  .msg-row.theirs .bubble{background:#24242B;border:1px solid rgba(255,255,255,0.10);color:var(--text);border-bottom-left-radius:6px;}
  .msg-row.pending .bubble{opacity:.62;}
  .bubble.media{padding:3px;overflow:hidden;}
  .bubble.media img{max-width:280px;max-height:300px;border-radius:14px;cursor:zoom-in;width:100%;object-fit:cover;display:block;}
  .bubble.media audio{width:220px;margin:4px;filter:invert(0.9) hue-rotate(180deg);display:block;}
  .bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
  .meta-row{display:flex;align-items:center;gap:4px;margin-top:4px;font-family:var(--font-mono);font-size:9px;opacity:.55;}
  .msg-row.mine .meta-row{justify-content:flex-end;color:rgba(10,10,12,0.6);}
  .msg-row.theirs .meta-row{color:var(--text-3);}
  .ticks svg{width:12px;height:12px;}
  .reply-quote{border-left:2px solid currentColor;opacity:.7;padding:6px 8px;border-radius:8px;margin-bottom:7px;font-size:12.5px;line-height:1.4;background:rgba(0,0,0,0.06);cursor:pointer;}
  .msg-row.theirs .reply-quote{background:rgba(255,255,255,0.06);}
  .reply-quote b{font-size:11px;display:block;opacity:.9;margin-bottom:2px;}
  .reactions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .reactions:empty{display:none;}
  .reaction-pill{padding:2px 7px;border-radius:100px;background:rgba(255,255,255,0.10);border:1px solid var(--border);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;}
  .msg-row.mine .reaction-pill{background:rgba(10,10,12,0.08);border-color:rgba(10,10,12,0.12);}
  .reaction-pill.active{background:#F2F0E8;color:#0A0A0C;border-color:#F2F0E8;}
  .msg-row.mine .reaction-pill.active{background:#0A0A0C;color:#F2F0E8;border-color:#0A0A0C;}
  .reaction-bar{display:none;gap:4px;background:#1A1A1E;border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:var(--shadow-lg);position:absolute;bottom:calc(100% + 6px);z-index:5;}
  .reaction-bar.show{display:flex;}
  .msg-row.mine .reaction-bar{right:0;}
  .msg-row.theirs .reaction-bar{left:0;}
  .reaction-bar button{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,0.06);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .reaction-bar button:hover{transform:scale(1.15);background:rgba(255,255,255,0.12);}
  .msg-actions{display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .18s;pointer-events:none;flex-shrink:0;}
  .msg-row:hover .msg-actions, .msg-row.show-actions .msg-actions{opacity:1;pointer-events:auto;}
  .msg-act{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface-soft);color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;font-size:11px;}
  .msg-act:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-strong);}
  .msg-act.pin-active{background:#F2F0E8;color:#0A0A0C;border-color:#F2F0E8;}
  .msg-act.del:hover{background:rgba(255,107,122,0.12);color:var(--danger);}
  @media (max-width:760px){.msg-row:hover .msg-actions{opacity:0;pointer-events:none;} .msg-row.show-actions .msg-actions{opacity:1;pointer-events:auto;}}
  .pin-badge{position:absolute;top:-7px;right:10px;background:#F2F0E8;color:#0A0A0C;font-family:var(--font-mono);font-size:9px;letter-spacing:.8px;padding:2px 6px;border-radius:100px;display:flex;align-items:center;gap:3px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
  .reply-preview{display:none;align-items:center;gap:8px;background:var(--surface-soft);border:1px solid var(--border);border-left:3px solid var(--text);border-radius:12px;padding:8px 10px;margin-bottom:8px;}
  .reply-preview.show{display:flex;}
  .reply-preview .rp-text{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .reply-preview .rp-text b{font-size:11px;display:block;opacity:.7;}
  .reply-preview button{width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,0.08);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* ---------- media gallery ---------- */
  .gallery{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:70;display:none;flex-direction:column;}
  .gallery.show{display:flex;}
  .gallery-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;border-bottom:1px solid rgba(255,255,255,0.08);flex-wrap:wrap;}
  .gallery-title{font-family:var(--font-display);font-weight:700;font-size:15px;}
  .gallery-tabs{display:flex;gap:6px;}
  .gtab{padding:6px 13px;border-radius:100px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text-2);font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
  .gtab.active{background:#F2F0E8;color:#0A0A0C;border-color:#F2F0E8;}
  .gallery-grid{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;align-content:start;}
  .gallery-item{position:relative;border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.04);border:1px solid var(--border);}
  .gallery-item.photo{aspect-ratio:1;}
  .gallery-item.photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block;}
  .gallery-item.voice{padding:10px;display:flex;flex-direction:column;gap:6px;justify-content:center;}
  .gallery-item.voice audio{width:100%;filter:invert(0.9) hue-rotate(180deg);}
  .gitem-meta{font-family:var(--font-mono);font-size:9px;color:var(--text-3);display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .gallery-item.photo .gitem-meta{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.75));color:#F2F0E8;}
  .gitem-dl{color:inherit;text-decoration:none;opacity:.85;font-size:11px;}
  .gallery-empty{grid-column:1/-1;text-align:center;color:var(--text-3);font-family:var(--font-mono);font-size:12px;padding:40px 20px;line-height:1.8;}

  /* ---------- modal ---------- */
  .modal-back{position:fixed;inset:0;background:rgba(6,6,8,0.72);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-back.show{display:flex;animation:fadeIn .18s var(--ease);}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);padding:22px;animation:modalIn .28s var(--ease);}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .modal-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px;background:rgba(255,255,255,0.07);border:1px solid var(--border);}
  .modal.danger .modal-icon{background:rgba(255,107,122,0.12);border-color:rgba(255,107,122,0.28);color:var(--danger);}
  .modal h3{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.2px;margin-bottom:7px;}
  .modal p{color:var(--text-2);font-size:13.2px;line-height:1.55;}
  .modal-actions{display:flex;gap:9px;margin-top:20px;}
  .modal-actions button{flex:1;padding:11px;border-radius:13px;border:1px solid var(--border);background:var(--surface-soft);color:var(--text-2);font-family:var(--font-display);font-size:13px;font-weight:600;cursor:pointer;transition:all .16s;}
  .modal-actions button:hover{background:var(--surface-hover);color:var(--text);}
  .modal-actions button.primary{background:#F2F0E8;color:#0A0A0C;border-color:#F2F0E8;}
  .modal-actions button.primary:hover{opacity:.88;background:#F2F0E8;color:#0A0A0C;}
  .modal-actions button.danger{background:var(--danger);color:#1A0508;border-color:var(--danger);}
  .modal-actions button.danger:hover{opacity:.88;background:var(--danger);color:#1A0508;}
  .modal-step{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-3);margin-bottom:9px;}

  .empty-state{margin:auto;text-align:center;color:var(--text-3);font-family:var(--font-mono);font-size:12px;padding:32px 20px;}
  .empty-icon{width:48px;height:48px;border-radius:50%;border:1px dashed var(--border);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:18px;font-style:italic;background:rgba(255,255,255,0.04);}
  .empty-state.loading .empty-icon{animation:emptySpin 1.4s linear infinite;}
  @keyframes emptySpin{to{transform:rotate(360deg)}}

  /* ---------- composer ---------- */
  .composer{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:8px;flex-shrink:0;position:relative;}
  .composer-row{display:flex;align-items:flex-end;gap:6px;}
  .pill{flex:1;display:flex;align-items:flex-end;gap:6px;background:#222228;border:1px solid var(--border);border-radius:20px;padding:6px 6px 6px 12px;transition:all .2s;}
  .pill:focus-within{border-color:rgba(255,255,255,0.18);background:#2A2A32;}
  #msg-input{flex:1;background:none;border:none;outline:none;resize:none;color:var(--text);font-family:var(--font-body);font-size:14px;max-height:110px;line-height:1.45;padding:4px 0;}
  #msg-input::placeholder{color:var(--text-3);}
  .send-btn{width:38px;height:38px;border-radius:50%;border:none;flex-shrink:0;background:#F2F0E8;color:#0A0A0C;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s var(--ease);}
  .send-btn svg{width:15px;height:15px;margin-left:1px;}
  .send-btn:disabled{opacity:.3;cursor:not-allowed;}
  .send-btn:not(:disabled):hover{transform:scale(1.05);}
  .icon-round{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface-soft);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .18s;}
  .icon-round:hover{color:var(--text);border-color:var(--border-strong);background:var(--surface-hover);}
  .icon-round svg{width:15px;height:15px;}
  .icon-round.recording{color:var(--danger);border-color:rgba(255,107,122,0.25);background:rgba(255,107,122,0.08);animation:pulseDot 1s infinite;}
  .emoji-toggle{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface-soft);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;transition:all .18s;}
  .emoji-toggle:hover{color:var(--text);border-color:var(--border-strong);}
  .emoji-pop{position:absolute;bottom:74px;left:10px;display:none;gap:6px;background:#1A1A1E;border:1px solid var(--border);border-radius:16px;padding:10px;flex-wrap:wrap;max-width:300px;box-shadow:var(--shadow-lg);z-index:5;}
  .emoji-pop.show{display:flex;}
  .emoji-pop button{font-size:19px;background:none;border:none;cursor:pointer;padding:5px;border-radius:10px;}
  .emoji-pop button:hover{background:rgba(255,255,255,0.07);}

  .scroll-fab{position:absolute;right:16px;bottom:84px;border-radius:100px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:none;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow);z-index:6;height:34px;padding:0 12px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.6px;}
  .scroll-fab.show{display:flex;}
  .scroll-fab .fab-count{background:#F2F0E8;color:#0A0A0C;border-radius:100px;padding:1px 6px;font-weight:700;display:none;}
  .scroll-fab.has-new .fab-count{display:inline-block;}

  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-150%);background:#F2F0E8;color:#0A0A0C;border-radius:12px;padding:10px 16px;font-family:var(--font-mono);font-size:12px;z-index:95;transition:transform .4s var(--ease);box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:80;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:16px;}
  /* ---------- voice call overlay ---------- */
  .call-overlay{position:fixed;inset:0;z-index:85;background:rgba(6,6,8,0.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px;}
  .call-overlay.show{display:flex;animation:fadeIn .2s var(--ease);}
  .call-card{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:modalIn .3s var(--ease);}
  .call-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:var(--text-3);margin-bottom:20px;}
  .call-avatar{width:104px;height:104px;border-radius:50%;background:#F2F0E8;color:#0A0A0C;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:38px;position:relative;box-shadow:0 18px 60px -18px rgba(242,240,232,0.35);}
  .call-avatar::before,.call-avatar::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:1.5px solid rgba(242,240,232,0.30);opacity:0;pointer-events:none;}
  .call-overlay.show[data-mode="incoming"] .call-avatar::before,
  .call-overlay.show[data-mode="outgoing"] .call-avatar::after{animation:callPulse 2.2s var(--ease) infinite;}
  .call-overlay.show[data-mode="incoming"] .call-avatar::after{animation-delay:1.1s;}
  @keyframes callPulse{0%{transform:scale(.94);opacity:0}30%{opacity:.8}100%{transform:scale(1.55);opacity:0}}
  .call-name{font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:-.4px;margin-top:20px;}
  .call-state{font-family:var(--font-mono);font-size:12px;color:var(--text-2);min-height:20px;margin-top:5px;}
  .call-timer{font-family:var(--font-mono);font-size:13.5px;color:var(--text);letter-spacing:1.5px;margin-top:2px;}
  .call-actions{display:flex;gap:26px;margin-top:36px;align-items:center;}
  .call-incoming-actions{display:none;gap:42px;margin-top:36px;align-items:center;}
  .call-overlay.show[data-mode="incoming"] .call-incoming-actions{display:flex;}
  .call-overlay.show[data-mode="incoming"] .call-actions{display:none;}
  .call-btn{width:58px;height:58px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-soft);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease);flex-shrink:0;}
  .call-btn svg{width:20px;height:20px;}
  .call-btn:hover{transform:scale(1.07);}
  .call-btn:active{transform:scale(.96);}
  .call-btn.end{background:var(--danger);border-color:var(--danger);color:#fff;}
  .call-btn.end:hover{background:#ff7f8c;transform:scale(1.07);}
  .call-btn.accept{background:var(--success);border-color:var(--success);color:#06251C;}
  .call-btn.decline{background:var(--danger);border-color:var(--danger);color:#fff;}
  .call-btn.muted{background:var(--warn);border-color:var(--warn);color:#2A1B05;}
  .call-btn.active{background:#F2F0E8;color:#0A0A0C;border-color:#F2F0E8;}


  @media (max-width:760px){
    .app{padding:0;height:100dvh;}
    .login-card{grid-template-columns:1fr;border-radius:22px;margin:12px;max-height:92vh;overflow:auto;}
    .login-left{min-height:auto;padding:28px 24px;}
    .hero h1{font-size:36px;}
    .login-right{padding:26px 22px;}
    .chat-wrap{padding:6px;gap:6px;height:100dvh;max-height:100dvh;max-width:none;}
    .topbar{border-radius:16px;}
    .messages-area{border-radius:16px;flex:1;min-height:0;}
    .composer{border-radius:16px;}
    .bubble{max-width:84%;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
    #messages{scroll-behavior:auto;}
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="sr-announcer" role="log" aria-live="polite" aria-atomic="true"></div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" src="" alt="Full size photo" /></div>

<div class="gallery" id="gallery" role="dialog" aria-modal="true" aria-label="Media gallery">
  <div class="gallery-head">
    <div class="gallery-title">Media</div>
    <div class="gallery-tabs">
      <button class="gtab active" data-tab="all">All</button>
      <button class="gtab" data-tab="image">Photos</button>
      <button class="gtab" data-tab="audio">Voice</button>
    </div>
    <button class="icon-btn" id="gallery-close" aria-label="Close media gallery" style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.12);color:#fff">✕</button>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>
</div>

<div class="modal-back" id="modal-back" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal">
    <div class="modal-icon" id="modal-icon">?</div>
    <div class="modal-step" id="modal-step" hidden></div>
    <h3 id="modal-title">Title</h3>
    <p id="modal-msg">Message</p>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-confirm" class="primary">Confirm</button>
    </div>
  </div>
</div>


<!-- voice call overlay -->
<div class="call-overlay" id="call-overlay" role="dialog" aria-modal="true" aria-label="Voice call">
  <audio id="call-audio" autoplay playsinline></audio>
  <div class="call-card">
    <div class="call-tag">Voice call</div>
    <div class="call-avatar"><span id="call-initial">?</span></div>
    <div class="call-name" id="call-name">—</div>
    <div class="call-state" id="call-state">Calling…</div>
    <div class="call-timer" id="call-timer" hidden>00:00</div>
    <div class="call-incoming-actions" id="call-incoming-actions">
      <button class="call-btn decline" id="call-decline" aria-label="Decline call" title="Decline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(135 12 12)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></g></svg></button>
      <button class="call-btn accept" id="call-accept" aria-label="Answer call" title="Answer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
    </div>
    <div class="call-actions" id="call-actions">
      <button class="call-btn" id="call-mute" style="display:none" aria-label="Mute" title="Mute"></button>
      <button class="call-btn end" id="call-end" aria-label="End call" title="End call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(135 12 12)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></g></svg></button>
      <button class="call-btn" id="call-speaker" style="display:none" aria-label="Speaker" title="Speaker"></button>
    </div>
  </div>
</div>

<div class="app">
  <div id="login-screen">
    <div class="login-card">
      <div class="login-left"><div><div class="brand-top"><div class="mark">P</div><div class="brand-name">PULSE</div><span class="brand-tag">PRIVATE</span></div><div class="hero"><h1>A quiet room<br><i>just for us</i></h1></div></div></div>
      <div class="login-right"><div class="eyebrow">Secure entry</div><div class="form-title">Welcome back</div><p class="form-desc">Select your name and enter the password.</p><span class="field-label" id="you-are-label">You are</span><div class="people-row" id="people-row" role="group" aria-labelledby="you-are-label"></div><label class="field-label" for="password-input">Password</label><div class="input-wrap"><input type="password" id="password-input" placeholder="••••••••" autocomplete="current-password" /><button class="toggle-visibility" id="toggle-visibility" type="button" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="enter-btn" id="enter-btn" disabled><span>Enter Channel</span><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button><div class="login-error" id="login-error" role="alert"></div></div>
    </div>
  </div>

  <div id="chat-screen">
    <div class="chat-wrap">
      <div class="topbar">
        <div class="peer"><div class="avatar" id="peer-avatar"><span id="peer-initial">?</span><span class="dot" id="live-dot" style="display:none"></span></div><div><div class="peer-name" id="peer-name">— <span class="verified" aria-hidden="true">✓</span></div><div class="peer-status" id="peer-status"><span class="sdot" aria-hidden="true"></span><span id="peer-status-text">Connecting…</span></div></div></div>
        <div class="top-actions">
          <div class="search-box" id="search-box"><span style="color:var(--text-3)" aria-hidden="true">⌕</span><input id="search-input" placeholder="Search…" aria-label="Search messages" /></div>
          <button class="icon-btn" id="gallery-btn" title="Media" aria-label="Open media gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
          <button class="icon-btn" id="search-toggle" title="Search" aria-label="Search messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-3.5-3.5"/></svg></button>
          <button class="icon-btn" id="call-btn" title="Voice call" aria-label="Start a voice call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
          <button class="icon-btn" id="clear-btn" title="Clear chat" aria-label="Delete all messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg></button>
          <button class="icon-btn" id="logout-btn" title="Logout" aria-label="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
        </div>
      </div>

      <div class="conn-banner" id="conn-banner"><span class="cdot" aria-hidden="true"></span><span id="conn-text">You're offline — messages will send when you reconnect.</span></div>

      <div class="pinned-bar" id="pinned-bar">
        <button class="pin-body" id="pinned-body"><span class="pin-icon" aria-hidden="true">📌</span><span class="pinned-text" id="pinned-text"></span></button>
        <button class="pinned-close" id="pinned-close" aria-label="Unpin message">✕</button>
      </div>

      <div class="messages-area" id="messages-area">
        <div class="chat-bg"></div>
        <div class="chat-wallpaper"></div>
        <div class="wallpaper-vignette"></div>
        <div class="wallpaper-noise"></div>
        <div id="messages" role="log" aria-label="Messages">
          <div class="load-older-wrap" id="load-older-wrap"><button class="load-older" id="load-older">↑ Load older messages</button></div>
          <div id="msg-list"></div>
          <div class="empty-state" id="empty-state"><div class="empty-icon" aria-hidden="true">✦</div><span id="empty-text">No messages yet.<br/>Send the first note to begin.</span></div>
        </div>
        <button class="scroll-fab" id="scroll-fab" aria-label="Scroll to latest messages"><span aria-hidden="true">↓</span><span class="fab-count" id="fab-count">0</span></button>
      </div>

      <div class="composer">
        <div class="reply-preview" id="reply-preview"><div class="rp-text" id="reply-preview-text"></div><button id="reply-cancel" aria-label="Cancel reply">✕</button></div>
        <div class="emoji-pop" id="emoji-pop"></div>
        <div class="composer-row">
          <button class="emoji-toggle" id="emoji-toggle" aria-label="Insert emoji">☺</button>
          <input type="file" id="file-input" accept="image/*" hidden />
          <button class="icon-round" id="attach-btn" title="Photo" aria-label="Attach a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg></button>
          <div class="pill"><textarea id="msg-input" rows="1" placeholder="Type a message…" aria-label="Message"></textarea></div>
          <button class="icon-round" id="mic-btn" title="Voice" aria-label="Record voice message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg></button>
          <button class="send-btn" id="send-btn" disabled aria-label="Send message"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDoc, setDoc, onSnapshot, query, orderBy, serverTimestamp, updateDoc, getDocs, deleteDoc, writeBatch, limit as fbLimit, startAfter, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CFG = window.APP_CONFIG;
const EMOJIS = ["😀","😂","❤️","🔥","👍","🎉","😢","😮","🙏","✨","😘","🤔","🥺","😍","🤍","🌙","☀️","🌸","🍓","💌","🫶","😊"];
const REACT_EMOJIS = ["❤️","😂","😮","😢","🙏","🔥"];
const LIVE_WINDOW = 30;      // live listener window (newest N) — small so the first load is fast
const OLDER_PAGE  = 30;      // how many older messages per "Load older" click
const MAX_DOM     = 260;     // hard cap of rows kept in the DOM
const SAFE        = 700000;  // max data-URL size that fits a Firestore doc

let me=null, partner=null, selectedPerson=null, db, auth, replyTo=null, editId=null;
let presenceTimer=null, unsubMessages=null, unsubPresence=null;
let unseenWhileHidden=0; const originalTitle=document.title;

const fbApp=initializeApp(CFG.firebaseConfig); auth=getAuth(fbApp); db=getFirestore(fbApp);
const $=(id)=>document.getElementById(id);

/* ============ toast + screen-reader announcer ============ */
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
function announce(msg){ const a=$("sr-announcer"); a.textContent=""; setTimeout(()=>{ a.textContent=msg; },50); }

/* ============ custom modal (replaces every confirm/alert) ============ */
const modalBack=$("modal-back");
let modalResolve=null;
function closeModal(result){ modalBack.classList.remove("show"); document.removeEventListener("keydown",modalKeys); const r=modalResolve; modalResolve=null; if(r) r(result); }
let modalDanger=false;
function modalKeys(e){ if(e.key==="Escape"){ e.preventDefault(); closeModal(false); } else if(e.key==="Enter" && !modalDanger){ e.preventDefault(); closeModal(true); } }
function showModal({title,message,confirmText="Confirm",cancelText="Cancel",danger=false,icon="?",step=null}){
  return new Promise(resolve=>{
    if(modalResolve) closeModal(false);
    modalResolve=resolve;
    modalDanger=danger;
    $("modal").classList.toggle("danger",danger);
    $("modal-icon").textContent=icon;
    const stepEl=$("modal-step");
    if(step){ stepEl.textContent=step; stepEl.hidden=false; } else stepEl.hidden=true;
    $("modal-title").textContent=title;
    $("modal-msg").textContent=message;
    const c=$("modal-confirm"), x=$("modal-cancel");
    c.textContent=confirmText; x.textContent=cancelText;
    c.className=danger?"danger":"primary";
    modalBack.classList.add("show");
    document.addEventListener("keydown",modalKeys);
    setTimeout(()=>(danger?x:c).focus(),60);
  });
}
$("modal-confirm").addEventListener("click",()=>closeModal(true));
$("modal-cancel").addEventListener("click",()=>closeModal(false));
modalBack.addEventListener("click",(e)=>{ if(e.target===modalBack) closeModal(false); });

/* ============ connection / offline indicator ============ */
const connBanner=$("conn-banner"), connText=$("conn-text");
let isOffline=!navigator.onLine, isFromCache=false;
function renderConn(){
  if(isOffline){ connText.textContent="You're offline — messages will send when you reconnect."; connBanner.classList.add("show"); }
  else if(isFromCache){ connText.textContent="Connecting to the channel…"; connBanner.classList.add("show"); }
  else connBanner.classList.remove("show");
}
window.addEventListener("online",()=>{ isOffline=false; renderConn(); toast("Back online"); });
window.addEventListener("offline",()=>{ isOffline=true; renderConn(); });
renderConn();

/* ============ login ============ */
function personFor(email){ return CFG.people.find(p=>p.email===email)||null; }
const peopleRow=$("people-row");
const passwordInput=$("password-input"), enterBtn=$("enter-btn"), loginError=$("login-error");
CFG.people.forEach(person=>{
  const b=document.createElement("button"); b.className="person-btn"; b.type="button";
  const pa=document.createElement("span"); pa.className="pa"; pa.textContent=person.name[0].toUpperCase();
  const nm=document.createElement("span"); nm.textContent=person.name;
  b.append(pa,nm);
  b.onclick=()=>{ [...peopleRow.children].forEach(c=>{c.classList.remove("active");c.setAttribute("aria-pressed","false");}); b.classList.add("active"); b.setAttribute("aria-pressed","true"); selectedPerson=person; loginError.textContent=""; checkLoginReady(); passwordInput.focus(); };
  b.setAttribute("aria-pressed","false");
  peopleRow.appendChild(b);
});
function checkLoginReady(){ enterBtn.disabled=!(selectedPerson && passwordInput.value.length>0); }
passwordInput.addEventListener("input",checkLoginReady);
passwordInput.addEventListener("keydown",e=>{ if(e.key==="Enter" && !enterBtn.disabled) doLogin(); });
enterBtn.addEventListener("click",doLogin);
$("toggle-visibility").addEventListener("click",(e)=>{ const shown=passwordInput.type==="text"; passwordInput.type=shown?"password":"text"; e.currentTarget.setAttribute("aria-label",shown?"Show password":"Hide password"); });
async function doLogin(){
  if(!selectedPerson) return;
  enterBtn.disabled=true; loginError.textContent="";
  try{ await signInWithEmailAndPassword(auth, selectedPerson.email, passwordInput.value); }
  catch(err){ loginError.textContent="Incorrect password. Try again."; passwordInput.value=""; enterBtn.disabled=false; }
}
$("logout-btn").addEventListener("click", async()=>{
  const ok=await showModal({title:"Log out?",message:"You'll need the password to get back into this channel.",confirmText:"Log out",icon:"→"});
  if(!ok) return;
  teardown();
  signOut(auth).finally(()=>location.reload());
});
function teardown(){
  if(presenceTimer){ clearInterval(presenceTimer); presenceTimer=null; }
  if(unsubMessages){ unsubMessages(); unsubMessages=null; }
  if(unsubPresence){ unsubPresence(); unsubPresence=null; }
  if(incomingUnsub){ incomingUnsub(); incomingUnsub=null; }
  if(callId || callOverlay.classList.contains("show")) endCall("ended",true);
}
window.addEventListener("pagehide",teardown);

onAuthStateChanged(auth,user=>{
  if(user && user.email){
    const person=personFor(user.email);
    if(!person){ signOut(auth); loginError.textContent="This account isn't authorized for this channel."; return; }
    startApp(person);
  } else {
    teardown();
    $("login-screen").style.display="flex";
    $("chat-screen").classList.remove("show");
  }
});
function startApp(person){
  me=person.name;
  partner=(CFG.people.find(p=>p.email!==person.email)||CFG.people[0]).name;
  $("login-screen").style.display="none";
  $("chat-screen").classList.add("show");
  $("peer-name").childNodes[0].textContent=partner+" ";
  $("peer-initial").textContent=initials(partner);
  document.title=`PULSE · ${partner}`;
  initPresence(); initMessages();
  listenIncoming();
  getDoc(roomRef()).catch(()=>{});   // warm up the connection right after login
}

/* ============ helpers ============ */
function initials(n){ return (n||"?").trim().charAt(0).toUpperCase(); }
function fmtTime(d){ return d ? d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}) : ""; }
function fmtDate(d){
  const today=new Date(); if(d.toDateString()===today.toDateString()) return "Today";
  const y=new Date(today); y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-US",{day:"numeric",month:"long"});
}
const msgData=(d)=>d.data({serverTimestamps:"estimate"});
const tsOf=(data)=> data.ts?.toDate ? data.ts.toDate() : new Date();

/* ============ presence ============ */
const roomRef=()=>doc(db,"pulse_rooms",CFG.roomId);
const presenceRef=(name)=>doc(db,"pulse_rooms",CFG.roomId,"presence",name);
const messagesCol=()=>collection(db,"pulse_rooms",CFG.roomId,"messages");
const msgRef=(id)=>doc(db,"pulse_rooms",CFG.roomId,"messages",id);

function initPresence(){
  setDoc(roomRef(),{updatedAt:serverTimestamp()},{merge:true}).catch(()=>{});
  updatePresence({online:true});
  presenceTimer=setInterval(()=>updatePresence({}),15000);
  window.addEventListener("beforeunload",()=> updatePresence({online:false}));
  document.addEventListener("visibilitychange",()=>{
    updatePresence({online:!document.hidden});
    if(!document.hidden){ unseenWhileHidden=0; document.title=`PULSE · ${partner}`; markIncomingSeen(); }
  });
  unsubPresence=onSnapshot(presenceRef(partner),snap=> renderPeerPresence(snap.data(),snap.metadata.fromCache), err=>console.error("presence error",err));
}
function updatePresence(extra){ setDoc(presenceRef(me),{name:me,lastActive:serverTimestamp(),online:true,...extra},{merge:true}).catch(()=>{}); }
function renderPeerPresence(d,fromCache){
  const statusText=$("peer-status-text"), liveDot=$("live-dot"), statusEl=$("peer-status");
  if(!d){ statusText.textContent=fromCache?"Connecting…":"Hasn't joined yet"; liveDot.style.display="none"; return; }
  const last=d.lastActive?.toDate?d.lastActive.toDate():null;
  const online=d.online && last && (Date.now()-last.getTime()<40000);
  statusEl.classList.toggle("online",!!online);
  liveDot.style.display=online?"block":"none";
  statusText.textContent = online ? "Online · active now" : (last ? "Last active "+fmtTime(last) : "Offline");
}

/* ============ composer ============ */
const msgInput=$("msg-input"), sendBtn=$("send-btn");
const SEND_ICON=`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>`;
const EDIT_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
msgInput.addEventListener("input",()=>{
  autoGrow();
  const hasText=msgInput.value.trim().length>0;
  sendBtn.disabled=!hasText;
  sendBtn.innerHTML=(hasText && editId)?EDIT_ICON:SEND_ICON;
});
function autoGrow(){ msgInput.style.height="auto"; msgInput.style.height=Math.min(msgInput.scrollHeight,110)+"px"; }
msgInput.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
  if(e.key==="Escape"){ cancelReply(); cancelEdit(); }
});
msgInput.addEventListener("focus",()=> setTimeout(()=>{ if(isNearBottom()) scrollToBottom(); },300));
if(window.visualViewport) window.visualViewport.addEventListener("resize",()=> setTimeout(()=>{ if(isNearBottom()) scrollToBottom(); },100));

/* ============ message store ============ */
const messagesEl=$("messages"), msgList=$("msg-list"), emptyState=$("empty-state");
function renderEmptyState(fromCache){
  if(rowById.size){ emptyState.style.display="none"; return; }
  emptyState.style.display="block";
  emptyState.classList.toggle("loading",!!fromCache);
  const t=$("empty-text");
  if(t) t.innerHTML = fromCache ? "Loading messages…" : "No messages yet.<br/>Send the first note to begin.";
}
const rowById=new Map();     // id -> row element
const dataById=new Map();    // id -> latest data
const seenMarked=new Set();  // A6: ids we already flagged as seen
let orderedIds=[];           // ascending by ts
let oldestTs=null;           // cursor for pagination
let liveFull=false;          // live window came back full => older history exists
let reachedStart=false;      // we've paged back to the very first message
let loadingOlder=false;
let galleryTab="all";
let pendingNew=0;
let reorderQueued=false;
let syncStallTimer=null;

function isNearBottom(px=90){ return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < px; }
function scrollToBottom(smooth=false){
  messagesEl.scrollTo({top:messagesEl.scrollHeight, behavior: smooth?"smooth":"auto"});
  pendingNew=0; updateFab();
}
function updateFab(){
  const fab=$("scroll-fab");
  const near=isNearBottom();
  fab.classList.toggle("show", !near || pendingNew>0);
  fab.classList.toggle("has-new", pendingNew>0);
  $("fab-count").textContent=pendingNew>99?"99+":String(pendingNew);
}
messagesEl.addEventListener("scroll",()=>{ if(isNearBottom()){ pendingNew=0; } updateFab(); },{passive:true});
$("scroll-fab").addEventListener("click",()=>scrollToBottom(true));

function initMessages(){
  const q=query(messagesCol(), orderBy("ts","desc"), fbLimit(LIVE_WINDOW));
  unsubMessages=onSnapshot(q,{includeMetadataChanges:true},snap=>{
    const cacheNow=snap.metadata.fromCache;
    if(cacheNow!==isFromCache){ isFromCache=cacheNow; renderConn(); }
    if(!cacheNow && syncStallTimer){ clearTimeout(syncStallTimer); syncStallTimer=null; }
    else if(cacheNow && !syncStallTimer){
      syncStallTimer=setTimeout(()=>{
        syncStallTimer=null;
        if(isFromCache) connText.textContent="Still connecting — check your internet connection.";
      },15000);
    }

    const wasNear=isNearBottom();
    let newIncoming=0, lastIncomingText="";
    let structural=false;

    // oldest ts still inside the live window — anything older that reports
    // "removed" merely scrolled out of the window, it was NOT deleted.
    const windowOldest = snap.docs.length ? tsOf(msgData(snap.docs[snap.docs.length-1])).getTime() : null;

    snap.docChanges().forEach(change=>{
      const id=change.doc.id, data=msgData(change.doc);
      if(change.type==="added"){
        if(rowById.has(id)){ dataById.set(id,data); updateRow(id,data); return; }
        dataById.set(id,data);
        const row=buildRow(id,data);
        rowById.set(id,row); msgList.appendChild(row); structural=true;
        if(data.sender===partner && !change.doc.metadata.hasPendingWrites){
          newIncoming++; lastIncomingText = data.text || (data.type==="image"?"a photo":"a voice message");
        }
      } else if(change.type==="modified"){
        dataById.set(id,data); updateRow(id,data);
      } else if(change.type==="removed"){
        const t=tsOf(msgData(change.doc)).getTime();
        const evicted = windowOldest!==null && t < windowOldest;
        if(evicted){ liveFull=true; return; }   // still valid history, keep it on screen
        removeRow(id); structural=true;
      }
    });

    // "load older" availability
    if(!snap.metadata.fromCache && snap.docs.length>=LIVE_WINDOW) liveFull=true;
    if(structural) queueReorder();

    renderEmptyState(snap.metadata.fromCache);
    refreshPinnedBar();
    markIncomingSeen();

    if(structural){
      requestAnimationFrame(()=>{
        if(wasNear){ scrollToBottom(); trimDom(); }        // A5: only auto-scroll if already at the bottom
        else if(newIncoming){ pendingNew+=newIncoming; }
        updateFab();
      });
    }
    if(newIncoming){
      announce(`New message from ${partner}: ${String(lastIncomingText).slice(0,120)}`);
      if(document.hidden){ unseenWhileHidden+=newIncoming; document.title=`(${unseenWhileHidden}) New message · PULSE`; }
    }
  },err=>{
    console.error("messages listener error:",err);
    toast("Connection problem — retrying…");
    if(unsubMessages){ try{unsubMessages();}catch(_){} unsubMessages=null; }
    if(me && !unsubMessages) setTimeout(initMessages,3000);
  });
}

/* --- ordering + date separators (correct after prepending older pages) --- */
function queueReorder(){
  if(reorderQueued) return;
  reorderQueued=true;
  requestAnimationFrame(()=>{
    reorderQueued=false;
    orderedIds=[...rowById.keys()].sort((a,b)=>{
      const ta=dataById.get(a), tb=dataById.get(b);
      return (tsOf(ta||{}).getTime()) - (tsOf(tb||{}).getTime());
    });
    msgList.querySelectorAll(".date-sep").forEach(el=>el.remove());
    orderedIds.forEach((id,i)=>{
      const el=rowById.get(id);
      if(msgList.children[i]!==el) msgList.insertBefore(el, msgList.children[i]||null);
    });
    let last="";
    orderedIds.forEach(id=>{
      const el=rowById.get(id);
      const label=fmtDate(tsOf(dataById.get(id)||{}));
      if(label!==last){
        const sep=document.createElement("div"); sep.className="date-sep"; sep.textContent=label;
        msgList.insertBefore(sep,el); last=label;
      }
    });
    const firstId=orderedIds[0];
    oldestTs = firstId ? (dataById.get(firstId)?.ts || null) : null;
    $("load-older-wrap").classList.toggle("show", hasMoreOlder());
  });
}

/* --- load older messages (beyond the live window) --- */
$("load-older").addEventListener("click",loadOlder);
function hasMoreOlder(){ return !reachedStart && liveFull && !!oldestTs; }
async function loadOlder(){
  if(loadingOlder || !hasMoreOlder()) return 0;
  loadingOlder=true;
  const btn=$("load-older"); btn.disabled=true; btn.textContent="Loading…";
  const keepHeight=messagesEl.scrollHeight, keepTop=messagesEl.scrollTop;
  let added=0;
  try{
    const snap=await getDocs(query(messagesCol(), orderBy("ts","desc"), startAfter(oldestTs), fbLimit(OLDER_PAGE)));
    snap.docs.forEach(d=>{
      const id=d.id; if(rowById.has(id)) return;
      const data=msgData(d);
      dataById.set(id,data);
      const row=buildRow(id,data);
      rowById.set(id,row); msgList.appendChild(row); added++;
    });
    if(snap.docs.length<OLDER_PAGE) reachedStart=true;
    if(added) queueReorder();
    if(!added && reachedStart) toast("You've reached the beginning");
    requestAnimationFrame(()=>{ messagesEl.scrollTop = keepTop + (messagesEl.scrollHeight-keepHeight); });
  }catch(e){ console.error(e); toast("Couldn't load older messages"); }
  finally{
    loadingOlder=false; btn.disabled=false; btn.textContent="↑ Load older messages";
    $("load-older-wrap").classList.toggle("show",hasMoreOlder());
    renderEmptyState(isFromCache);
  }
  return added;
}

/* --- DOM trimming: keep memory sane with base64 media in the page --- */
function trimDom(){
  if(orderedIds.length<=MAX_DOM) return;
  const excess=orderedIds.length-MAX_DOM;
  for(let i=0;i<excess;i++){
    const id=orderedIds[i];
    const el=rowById.get(id);
    if(el) el.remove();
    rowById.delete(id); dataById.delete(id);
  }
  orderedIds=orderedIds.slice(excess);
  liveFull=true; reachedStart=false;
  queueReorder();
}

function removeRow(id){
  const el=rowById.get(id); if(el) el.remove();
  rowById.delete(id); dataById.delete(id); seenMarked.delete(id);
  orderedIds=orderedIds.filter(x=>x!==id);
  if(!rowById.size) renderEmptyState(isFromCache);
}

/* ============ pinned bar (A1 crash + A2 XSS fixed) ============ */
function pinnedEntry(){
  let best=null;
  dataById.forEach((data,id)=>{
    if(!data.pinned) return;
    const at=data.pinnedAt?.seconds||0;
    if(!best || at>best.at) best={id,data,at};
  });
  return best;
}
function refreshPinnedBar(){
  const bar=$("pinned-bar"), txt=$("pinned-text");
  const p=pinnedEntry();
  if(!p){ bar.classList.remove("show"); return; }
  bar.classList.add("show");
  const label=p.data.text || (p.data.type==="image"?"📷 Photo":"🎙 Voice");
  txt.textContent="";                                  // A2: textContent, never innerHTML
  const b=document.createElement("b"); b.textContent=`📌 ${p.data.sender}: `;
  txt.append(b, document.createTextNode(String(label).slice(0,60)));
}
$("pinned-body").addEventListener("click",()=>{
  const p=pinnedEntry(); if(!p) return;
  const row=rowById.get(p.id);
  if(!row){ toast("That message isn't loaded — try Load older"); return; }   // A1: guarded
  row.scrollIntoView({behavior:"smooth",block:"center"});
  row.classList.add("flash");
  setTimeout(()=>row.classList.remove("flash"),1200);
});
$("pinned-close").addEventListener("click",async(e)=>{
  e.stopPropagation();
  const p=pinnedEntry(); if(!p) return;
  try{ await updateDoc(msgRef(p.id),{pinned:false}); }                        // A3: no full-collection read
  catch(err){ toast("Couldn't unpin"); }
});

/* ============ row building ============ */
const URL_RE=/(https?:\/\/[^\s<]+)/g;
function linkify(text,target){
  let last=0; let m;
  URL_RE.lastIndex=0;
  while((m=URL_RE.exec(text))!==null){
    if(m.index>last) target.appendChild(document.createTextNode(text.slice(last,m.index)));
    const a=document.createElement("a"); a.href=m[0]; a.textContent=m[0]; a.target="_blank"; a.rel="noopener noreferrer";
    a.addEventListener("click",e=>e.stopPropagation());
    target.appendChild(a); last=m.index+m[0].length;
  }
  if(last<text.length) target.appendChild(document.createTextNode(text.slice(last)));
}

function buildRow(id,data){
  const ts=tsOf(data);
  const mine=data.sender===me;
  const row=document.createElement("div");
  row.className=`msg-row ${mine?"mine":"theirs"}`;
  row.dataset.id=id;
  row._ts=ts;

  const bubble=document.createElement("div"); bubble.className="bubble"; row._bubble=bubble;

  if(data.replyTo){
    const q=document.createElement("div"); q.className="reply-quote";
    const b=document.createElement("b"); b.textContent=data.replyTo.sender||"";   // A2
    const t=document.createTextNode(data.replyTo.text || (data.replyTo.type==="image"?"📷 Photo":"🎙 Voice"));
    q.append(b,t);
    q.onclick=(e)=>{
      e.stopPropagation();
      const target=rowById.get(data.replyTo.id);
      if(!target){ toast("Original message isn't loaded"); return; }
      target.scrollIntoView({behavior:"smooth",block:"center"});
      target.classList.add("flash"); setTimeout(()=>target.classList.remove("flash"),1200);
    };
    bubble.appendChild(q);
  }

  if(data.type==="image" && data.mediaData){
    bubble.classList.add("media");
    const img=document.createElement("img"); img.src=data.mediaData; img.alt="Photo"; img.loading="lazy"; img.decoding="async";
    img.addEventListener("click",(e)=>{ e.stopPropagation(); openLightbox(data.mediaData); });
    bubble.appendChild(img);
  } else if(data.type==="audio" && data.mediaData){
    bubble.classList.add("media");
    const audio=document.createElement("audio"); audio.controls=true; audio.preload="none"; audio.src=data.mediaData;
    audio.addEventListener("click",e=>e.stopPropagation());
    bubble.appendChild(audio);
  } else {
    const d=document.createElement("div"); d.style.whiteSpace="pre-wrap";
    linkify(data.text||"",d);
    bubble.appendChild(d); row._textEl=d;
  }

  const meta=document.createElement("div"); meta.className="meta-row";
  const timeSpan=document.createElement("span"); timeSpan.textContent=fmtTime(ts); meta.appendChild(timeSpan);
  const ed=document.createElement("span"); ed.textContent=" · edited"; ed.style.opacity=".5"; ed.style.fontSize="9px";
  ed.hidden=!data.edited; meta.appendChild(ed); row._editedEl=ed;
  if(mine){ const ticks=document.createElement("span"); ticks.className="ticks"; ticks.innerHTML=tickSvg(!!(data.seenBy||[]).includes(partner)); meta.appendChild(ticks); row._ticksEl=ticks; }
  bubble.appendChild(meta);

  const reactionsDiv=document.createElement("div"); reactionsDiv.className="reactions"; bubble.appendChild(reactionsDiv);
  row._reactionsDiv=reactionsDiv;

  const reactBar=document.createElement("div"); reactBar.className="reaction-bar";
  REACT_EMOJIS.forEach(em=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=em; b.setAttribute("aria-label",`React ${em}`);
    b.onclick=(e)=>{ e.stopPropagation(); toggleReaction(id,em); reactBar.classList.remove("show"); };
    reactBar.appendChild(b);
  });
  bubble.appendChild(reactBar);

  /* single vs double click — one handler, no more conflict */
  let clickTimer=null;
  bubble.addEventListener("click",()=>{
    if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; showReactionBar(row); return; }
    clickTimer=setTimeout(()=>{
      clickTimer=null;
      if(window.matchMedia("(hover: none)").matches) row.classList.toggle("show-actions");
    },260);
  });
  let pressTimer=null;
  bubble.addEventListener("touchstart",()=>{ pressTimer=setTimeout(()=>{ row.classList.add("show-actions"); },500); },{passive:true});

/* ============ image / voice (base64 — no Storage needed) ============ */
function compressImage(file,maxDim,quality){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; } }
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",quality));
      };
      img.onerror=rej; img.src=r.result;
    };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
async function compressImageToFit(file){
  for(const [d,q] of [[1024,0.62],[820,0.5],[640,0.42],[480,0.35]]){
    const u=await compressImage(file,d,q);
    if(u.length<=SAFE) return u;
  }
  return null;
}

/* ==================== voice calls — WebRTC with Firestore signaling ==================== */
const callsCol = ()=>collection(db,"pulse_rooms",CFG.roomId,"calls");
const callRef  = (id)=>doc(db,"pulse_rooms",CFG.roomId,"calls",id);
const offerRef = (id)=>doc(db,"pulse_rooms",CFG.roomId,"calls",id,"offer","sdp");
const answerRef=(id)=>doc(db,"pulse_rooms",CFG.roomId,"calls",id,"answer","sdp");
const candCol  = (id)=>collection(db,"pulse_rooms",CFG.roomId,"calls",id,"candidates");
const RTC_CONFIG={iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]};
const CALL_TIMEOUT=45000, DROP_GRACE=6000;

const ICON_MIC=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>`;
const ICON_MIC_OFF=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>`;
const ICON_SPEAKER=`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;

let pc=null, localStream=null, remoteStream=null;
let callId=null, callRole=null, callAccepted=false, micMuted=false, endingCall=false;
let callUnsubs=[], pendingCandidates=[], callWatchdog=null, ringLooper=null, ringCtx=null;
let callTimerInt=null, callStartTs=null, callTimeout=null, incomingUnsub=null, speakerOn=false;
const callOverlay=$("call-overlay"), callAudio=$("call-audio");

function showCallUI(mode){
  callOverlay.dataset.mode=mode;
  callOverlay.classList.add("show");
  $("call-btn").classList.add("active");
  $("call-name").textContent=partner;
