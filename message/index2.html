  $("call-timer").hidden=(mode!=="ongoing");
  $("call-timer").textContent="00:00";
  $("call-state").textContent = mode==="incoming" ? "Incoming call…" : mode==="outgoing" ? "Calling…" : "Connected";
  $("call-mute").style.display = mode==="ongoing" ? "flex" : "none";
  $("call-speaker").style.display = (mode==="ongoing" && typeof callAudio.setSinkId==="function") ? "flex" : "none";
}
function hideCallUI(){ callOverlay.classList.remove("show"); $("call-btn").classList.remove("active"); }

/* ringtone generated with Web Audio — no audio files needed */
function startRing(kind){
  stopRing();
  try{
    ringCtx=ringCtx||new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==="incoming" ? [[880,.30],[880,.30]] : [[660,.50]];
    const cycle = kind==="incoming" ? 1.15 : 1.9;
    const play=()=>{
      notes.forEach(([f,d],i)=>{
        const o=ringCtx.createOscillator(), g=ringCtx.createGain();
        const t0=ringCtx.currentTime + i*(d+.08);
        o.type="sine"; o.frequency.value=f;
        g.gain.setValueAtTime(0,t0);
        g.gain.linearRampToValueAtTime(.16,t0+.03);
        g.gain.exponentialRampToValueAtTime(.0001,t0+d);
        o.connect(g); g.connect(ringCtx.destination);
        o.start(t0); o.stop(t0+d+.05);
      });
    };
    play();
    ringLooper=setInterval(play,cycle*1000);
  }catch(e){}
}
function stopRing(){
  if(ringLooper){ clearInterval(ringLooper); ringLooper=null; }
  if(navigator.vibrate) navigator.vibrate(0);
}
function startCallTimer(){
  callStartTs=Date.now(); $("call-timer").textContent="00:00";
  callTimerInt=setInterval(()=>{
    const s=Math.max(0,Math.floor((Date.now()-callStartTs)/1000));
    $("call-timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  },1000);
}
function stopCallTimer(){ if(callTimerInt){ clearInterval(callTimerInt); callTimerInt=null; } }

function setupPC(){
  pc=new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{ if(e.candidate && callId) sendCandidate(e.candidate); };
  pc.ontrack=e=>{
    if(!remoteStream) remoteStream=e.streams[0];
    callAudio.srcObject=remoteStream;
    callAudio.play().catch(()=>{});
  };
  pc.oniceconnectionstatechange=()=>{
    const st=pc && pc.connectionState;
    if(!st || !callId || endingCall) return;
    if(st==="connected"){ if(callWatchdog){ clearTimeout(callWatchdog); callWatchdog=null; } }
    else if((st==="disconnected"||st==="failed") && !callWatchdog && callAccepted){
      callWatchdog=setTimeout(()=>{
        if(callId && pc && pc.connectionState!=="connected" && !endingCall){ toast("Connection lost"); endCall("dropped"); }
      },DROP_GRACE);
    }
  };
}
async function sendCandidate(c){
  try{ await addDoc(candCol(callId),{from:me,candidate:JSON.stringify(c.toJSON?c.toJSON():c),ts:serverTimestamp()}); }catch(e){}
}
function watchCandidates(){
  const un=onSnapshot(query(candCol(callId),orderBy("ts","asc")),snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type!=="added") return;
      const d=ch.doc.data();
      if(!d || d.from===me || !d.candidate) return;
      let c; try{ c=JSON.parse(d.candidate); }catch(e){ return; }
      if(pc && pc.remoteDescription) pc.addIceCandidate(c).catch(()=>{});
      else pendingCandidates.push(c);
    });
  },()=>{});
  callUnsubs.push(un);
}
function flushCandidates(){
  if(!pc || !pc.remoteDescription) return;
  pendingCandidates.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
  pendingCandidates=[];
}
function watchCallDoc(){
  const un=onSnapshot(callRef(callId),snap=>{
    if(!snap.exists()){
      if(!endingCall && callOverlay.classList.contains("show")){ toast("Call ended"); endCall("ended",true); }
      return;
    }
    const d=snap.data();
    if(d.status==="ongoing" && !callAccepted && !endingCall){
      callAccepted=true; stopRing(); showCallUI("ongoing"); startCallTimer(); flushCandidates();
    } else if((d.status==="ended"||d.status==="declined") && !endingCall && !callAccepted){
      stopRing();
      if(callRole==="caller") toast(d.reason==="busy"?"They're on another call":d.reason==="declined"?"Call declined":"No answer");
      else toast("Call ended");
      endCall("ended",true);
    } else if(d.status==="ended" && !endingCall && callAccepted){
      toast("Call ended"); endCall("ended",true);
    }
  },()=>{});
  callUnsubs.push(un);
}
function watchAnswer(){
  const un=onSnapshot(answerRef(callId),snap=>{
    if(snap.exists() && pc && !pc.remoteDescription){
      pc.setRemoteDescription(snap.data().sdp).then(flushCandidates).catch(()=>{});
    }
  },()=>{});
  callUnsubs.push(un);
}
function listenIncoming(){
  if(incomingUnsub){ incomingUnsub(); incomingUnsub=null; }
  const q=query(callsCol());   // whole subcollection — no composite index needed
  incomingUnsub=onSnapshot(q,snap=>{
    snap.docChanges().forEach(ch=>{
      const d=ch.doc.data();
      if(ch.type==="removed"){
        if(callId===ch.doc.id && callRole==="callee" && !callAccepted && !endingCall){
          toast(d && d.reason==="missed" ? "Missed call" : "Call ended");
          endCall("ended",true);
        }
        return;
      }
      if(ch.type!=="added" || !d || d.caller===me) return;
      if(d.callee!==me || d.status!=="ringing") return;   // client-side filter
      if(callId && callRole){
        updateDoc(callRef(ch.doc.id),{status:"ended",reason:"busy",endedAt:serverTimestamp()}).catch(()=>{});
        return;
      }
      callId=ch.doc.id; callRole="callee"; callAccepted=false;
      watchCallDoc(); watchCandidates();
      showCallUI("incoming"); startRing("incoming");
      if(navigator.vibrate) navigator.vibrate([250,120,250]);
    });
  },err=>{
    console.error("calls listener error:",err);
    if(incomingUnsub){ try{incomingUnsub();}catch(_){} incomingUnsub=null; }
    if(me) setTimeout(listenIncoming,3000);
  });
}
async function startCall(){
  if(callId || callOverlay.classList.contains("show")){ toast("You're already on a call"); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.RTCPeerConnection){ toast("Calling isn't supported in this browser"); return; }
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ toast("Microphone access is blocked"); return; }
  try{
    const ref=doc(callsCol()), id=ref.id;
    setupPC();
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    await setDoc(offerRef(id),{sdp:pc.localDescription,from:me,ts:serverTimestamp()});
    await setDoc(ref,{caller:me,callee:partner,callerName:me,calleeName:partner,status:"ringing",createdAt:serverTimestamp()});
    callId=id; callRole="caller"; callAccepted=false;
    watchCallDoc(); watchAnswer(); watchCandidates();
    showCallUI("outgoing"); startRing("outgoing");
    callTimeout=setTimeout(()=>{ if(callRole==="caller" && !callAccepted && !endingCall) endCall("missed"); },CALL_TIMEOUT);
  }catch(e){ console.error(e); toast("Couldn't start the call"); endCall("ended"); }
}
async function acceptCall(){
  if(!callId || callRole!=="callee" || callAccepted || endingCall) return;
  stopRing();
  if(ringCtx && ringCtx.state==="suspended") ringCtx.resume().catch(()=>{});
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
  catch(e){ toast("Microphone is blocked"); endCall("declined"); return; }
  callAccepted=true;
  try{
    setupPC();
    const off=await getDoc(offerRef(callId));
    if(!off.exists()) throw new Error("offer missing");
    await pc.setRemoteDescription(off.data().sdp);
    flushCandidates();
    const ans=await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await setDoc(answerRef(callId),{sdp:pc.localDescription,from:me,ts:serverTimestamp()});
    const cur=await getDoc(callRef(callId));
    if(!cur.exists() || cur.data().status!=="ringing") throw new Error("call gone");
    await updateDoc(callRef(callId),{status:"ongoing",acceptedAt:serverTimestamp()});
    showCallUI("ongoing"); startCallTimer();
  }catch(e){ console.error(e); toast("Couldn't connect the call"); endCall("declined"); }
}
function endCall(reason,silent){
  if(endingCall) return;
  endingCall=true;
  stopRing(); stopCallTimer(); hideCallUI();
  if(callTimeout){ clearTimeout(callTimeout); callTimeout=null; }
  if(callWatchdog){ clearTimeout(callWatchdog); callWatchdog=null; }
  const id=callId;
  if(id && !silent){
    updateDoc(callRef(id),{status:"ended",reason:reason||"ended",endedAt:serverTimestamp()}).catch(()=>{});
    setTimeout(()=>cleanupCall(id),2500);
  } else {
    cleanupCall(id);
  }
}
function cleanupCall(id){
  callUnsubs.forEach(u=>{ try{u();}catch(e){} });
  callUnsubs=[]; pendingCandidates=[];
  if(pc){ try{ pc.onicecandidate=null; pc.ontrack=null; pc.oniceconnectionstatechange=null; pc.close(); }catch(e){} pc=null; }
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if(remoteStream){ remoteStream.getTracks().forEach(t=>t.stop()); remoteStream=null; }
  callAudio.srcObject=null;
  callId=null; callRole=null; callAccepted=false; micMuted=false; endingCall=false; callWatchdog=null;
  speakerOn=false; $("call-speaker").classList.remove("active");
  setMicState(false);
  hideCallUI();
  if(id) deleteCallDocs(id);
}
function deleteCallDocs(id){
  getDocs(candCol(id)).then(snap=>{ const b=writeBatch(db); snap.docs.forEach(d=>b.delete(d.ref)); return b.commit(); }).catch(()=>{});
  deleteDoc(offerRef(id)).catch(()=>{});
  deleteDoc(answerRef(id)).catch(()=>{});
  deleteDoc(callRef(id)).catch(()=>{});
}
function setMicState(m){
  $("call-mute").classList.toggle("muted",m);
  $("call-mute").setAttribute("aria-label",m?"Unmute":"Mute");
  $("call-mute").innerHTML=m?ICON_MIC_OFF:ICON_MIC;
}
setMicState(false);
$("call-btn").addEventListener("click",startCall);
$("call-end").addEventListener("click",()=>{
  if(!callId || endingCall) return;
  endCall(!callAccepted ? (callRole==="caller"?"canceled":"declined") : "ended");
});
$("call-accept").addEventListener("click",acceptCall);
$("call-decline").addEventListener("click",()=>{ if(callId && callRole==="callee" && !callAccepted && !endingCall) endCall("declined"); });
$("call-mute").addEventListener("click",()=>{
  micMuted=!micMuted;
  if(localStream) localStream.getAudioTracks().forEach(t=>t.enabled=!micMuted);
  setMicState(micMuted);
});
$("call-speaker").addEventListener("click",async()=>{
  if(typeof callAudio.setSinkId!=="function") return;
  try{
    if(speakerOn){ await callAudio.setSinkId(""); speakerOn=false; $("call-speaker").classList.remove("active"); }
    else{
      const devs=await navigator.mediaDevices.enumerateDevices();
      const out=devs.filter(d=>d.kind==="audiooutput" && d.deviceId);
      const t=out.find(d=>d.deviceId!=="default")||out[0];
      if(t){ await callAudio.setSinkId(t.deviceId); speakerOn=true; $("call-speaker").classList.add("active"); }
    }
  }catch(e){}
});

/* ============ clear chat — two-step confirmation ============ */
$("clear-btn").addEventListener("click",async()=>{
  const first=await showModal({step:"Step 1 of 2",title:"Delete all messages?",message:`Every message, photo and voice note in this channel will be removed for both you and ${partner}.`,confirmText:"Continue",danger:true,icon:"🗑"});
  if(!first) return;
  const second=await showModal({step:"Step 2 of 2",title:"Are you absolutely sure?",message:"This is permanent. There is no undo and no backup. Confirm once more to erase the entire chat history.",confirmText:"Yes, erase everything",cancelText:"Keep messages",danger:true,icon:"⚠"});
  if(!second) return;
  toast("Clearing…");
  try{
    let total=0;
    while(true){
      const snap=await getDocs(query(messagesCol(), fbLimit(400)));
      if(snap.empty) break;
      const batch=writeBatch(db);
      snap.docs.forEach(d=>batch.delete(d.ref));
      await batch.commit();
      total+=snap.size;
      if(snap.size<400) break;
    }
    rowById.forEach(el=>el.remove());
    rowById.clear(); dataById.clear(); seenMarked.clear();
    orderedIds=[]; oldestTs=null; liveFull=false; reachedStart=true;
    msgList.querySelectorAll(".date-sep").forEach(el=>el.remove());
    $("load-older-wrap").classList.remove("show");
    renderEmptyState(false);
    refreshPinnedBar();
    toast(total?`Cleared ${total} messages`:"Nothing to clear");
  }catch(e){ console.error(e); toast("Couldn't clear the chat"); }
});

/* ============ search (debounced) ============ */
const searchBox=$("search-box"), searchInput=$("search-input");
let searchTimer=null;
$("search-toggle").addEventListener("click",()=>{
  const show=searchBox.classList.toggle("show");
  if(show) searchInput.focus(); else { searchInput.value=""; applyFilter(""); }
});
searchInput.addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>applyFilter(searchInput.value.toLowerCase().trim()),160);
});
function applyFilter(q){
  let hits=0;
  rowById.forEach(row=>{
    const show=!q || (row._text && row._text.includes(q));
    row.style.display=show?"":"none";
    if(q && show) hits++;
  });
  msgList.querySelectorAll(".date-sep").forEach(el=>{ el.style.display=q?"none":""; });
  if(q) announce(`${hits} matching message${hits===1?"":"s"}`);
}

/* ============ media gallery ============ */
const galleryEl=$("gallery"), galleryGrid=$("gallery-grid");
function collectMedia(){
  const out=[];
  dataById.forEach((data,id)=>{ if((data.type==="image"||data.type==="audio") && data.mediaData) out.push({id,...data}); });
  return out.sort((a,b)=> tsOf(b).getTime()-tsOf(a).getTime());
}
function renderGallery(){
  const items=collectMedia().filter(i=> galleryTab==="all" ? true : i.type===galleryTab);
  galleryGrid.textContent="";
  if(!items.length){
    const d=document.createElement("div"); d.className="gallery-empty";
    d.textContent = hasMoreOlder() ? "No media in the loaded messages. Load older messages to find more." : "No photos or voice notes yet.";
    galleryGrid.appendChild(d);
  } else {
    const frag=document.createDocumentFragment();
    items.forEach(item=>{
      const div=document.createElement("div");
      div.className="gallery-item "+(item.type==="image"?"photo":"voice");
      if(item.type==="image"){
        const img=document.createElement("img"); img.src=item.mediaData; img.loading="lazy"; img.decoding="async"; img.alt=`Photo from ${item.sender}`;
        img.onclick=()=>openLightbox(item.mediaData);
        div.appendChild(img);
      } else {
        const a=document.createElement("audio"); a.controls=true; a.preload="none"; a.src=item.mediaData;
        div.appendChild(a);
      }
      const meta=document.createElement("div"); meta.className="gitem-meta";
      const who=document.createElement("span"); who.textContent=`${item.sender} · ${fmtTime(tsOf(item))}`;
      const dl=document.createElement("a"); dl.className="gitem-dl"; dl.href=item.mediaData;
      dl.download=(item.type==="image"?"pulse-photo-":"pulse-voice-")+item.id+(item.type==="image"?".jpg":".webm");
      dl.textContent="↓"; dl.title="Download"; dl.setAttribute("aria-label","Download");
      meta.append(who,dl); div.appendChild(meta);
      frag.appendChild(div);
    });
    galleryGrid.appendChild(frag);
    if(hasMoreOlder()){
      const more=document.createElement("div"); more.className="gallery-empty";
      const btn=document.createElement("button"); btn.className="load-older"; btn.textContent="↑ Load older history for more media";
      btn.onclick=async()=>{ btn.disabled=true; btn.textContent="Loading…"; const n=await loadOlder(); btn.disabled=false; btn.textContent="↑ Load older history for more media"; renderGallery(); };
      more.appendChild(btn); galleryGrid.appendChild(more);
    }
  }
}
$("gallery-btn").addEventListener("click",()=>{ renderGallery(); galleryEl.classList.add("show"); });
$("gallery-close").addEventListener("click",()=>galleryEl.classList.remove("show"));
galleryEl.addEventListener("click",(e)=>{ if(e.target===galleryEl) galleryEl.classList.remove("show"); });
document.querySelectorAll(".gtab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".gtab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); galleryTab=t.dataset.tab; renderGallery();
  });
});
document.addEventListener("keydown",(e)=>{
  if(e.key!=="Escape") return;
  if(lightbox.classList.contains("show")){ lightbox.classList.remove("show"); lightboxImg.src=""; }
  else if(galleryEl.classList.contains("show")) galleryEl.classList.remove("show");
});
</script>
